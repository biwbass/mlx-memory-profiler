name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The runners are pods on Raspberry Pis. A superseded run is not worth the node
# time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # The org-wide ARC scale set (homelab-infra apps/arc-runners-org, runner
    # group "Raspberry Pi"). This label is that chart's runnerScaleSetName --
    # the two must be changed together. The "Raspberry Pi" runner group must
    # also grant this repo access.
    runs-on: biwbass

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # MLX is Apple-silicon only and never installs on these arm64 Linux
      # runners -- the same way hailo-detect's CI skips HailoRT. profiler.py
      # doesn't import MLX at all (the model server is a child process), so the
      # sampler maths, the metrics scrape and the FastAPI app are all exercised
      # here; only a live model server needs real hardware.
      - name: Install dependencies (no mlx)
        run: |
          python -m pip install --disable-pip-version-check \
            psutil fastapi 'uvicorn[standard]' prometheus-client pytest httpx

      - name: Byte-compile every module
        run: python -m compileall -q *.py src

      - name: Test
        run: pytest -q
