[project]
name = "mlx-memory-profiler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jordan Thomas", email = "jordanthomas761@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "mlx-lm>=0.31.3",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
# Needed only for profiler.py (the mlx_lm.server wrapper + /metrics endpoint).
service = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "prometheus-client>=0.21",
]
# Test suite. `uv sync --extra service --extra dev` for the full set.
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
mlx-memory-profiler = "mlx_memory_profiler:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
